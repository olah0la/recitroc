services:
  nginx:
    image: nginxproxy/nginx-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DISABLE_ACCESS_LOGS=1
      - TRUST_DOWNSTREAM_PROXY=false

  backend:
    image: recitroc-backend:latest
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/requirements.txt:/app/requirements.txt
    environment:
      - VIRTUAL_HOST=recitroc.localhost
      - VIRTUAL_PORT=8000
      - VIRTUAL_PATH=/api/
      - VIRTUAL_DEST=/
    expose:
      - "8000"

  frontend:
    image: recitroc-frontend:latest
    build:
      context: ./frontend
      target: development
    command: npm run dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    environment:
      - VIRTUAL_HOST=recitroc.localhost
      - VIRTUAL_PORT=3000
      - VIRTUAL_PATH=/
    expose:
      - "3000"
    depends_on:
      - backend

