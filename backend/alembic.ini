# Alembic configuration.
#
# TEACHING NOTE — what Alembic is:
# Alembic versions your database schema the way git versions your code.
# Each migration file is a diff (upgrade/downgrade); the `alembic_version`
# table in postgres records which revision a database is at, and
# `alembic upgrade head` replays whatever is missing.
#
# Day-to-day commands (run inside the backend container — `make shell-back`):
#   alembic revision --autogenerate -m "add foo column"   # generate a diff
#   alembic upgrade head                                  # apply migrations
#   alembic downgrade -1                                  # roll back one
#   alembic history                                       # list revisions

[alembic]
script_location = alembic

# Include the date in filenames so `ls alembic/versions` reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .

# NOTE: sqlalchemy.url is deliberately NOT set here. Hardcoding credentials
# in a committed file is a leak; env.py injects settings.DATABASE_URL from
# the environment instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
