repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
-   repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
    -   id: black
-   repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
    -   id: isort
        # Without the black profile, isort and black rewrap multi-line
        # imports differently and undo each other forever. `app` must be
        # declared first-party explicitly: isort runs from the repo root
        # and cannot see that backend/app is our package.
        args: ["--profile=black", "--project=app"]
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
    -   id: ruff
